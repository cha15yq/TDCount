name: rgbtcc
channels:
  - pytorch
  - defaults
  - nvidia
dependencies:
  - python=3.10
  - pip
  - numpy=1.26.4
  - pip:
    - torch==2.1.0 --index-url https://download.pytorch.org/whl/cu118
    - torchvision==0.16.0 --index-url https://download.pytorch.org/whl/cu118
    - torchaudio==2.1.0 --index-url https://download.pytorch.org/whl/cu118
    - "numpy<2"
    - opencv-python
    - h5py
    - matplotlib
    - scipy
    - timm==1.0.15
    - 'diffusers[torch]==0.32.2'
    - huggingface-hub==0.29.3
    - accelerate==1.5.2
    - tensorboard
    - peft==0.15.1
    - git+https://github.com/huggingface/transformers@c9d1e5238a752813ba91a8751a638a09b5efbb73
